id: test-rel00.2-floats
title: Test Suite for Release 00.2 Floats
release: "00.2"

overview: |
  This suite plans the evidence for the float renderers and the backport
  constraint they answer to. Its cases carry no Go test yet: the components
  land with rel00.2, and each case names the acceptance criteria that
  release has to satisfy. The backport cases run against the reader the
  consuming pipeline uses, so they are skipped where that reader is absent.

traces:
  - rel00.2-uc001-floats-in-two-columns

preconditions:
  - The text core of rel00.1 converts a prose chapter end to end.
  - 'The float renderers are implemented: srd004-figures and srd005-tables.'
  - The pipeline reader is available for the backport cases, which skip cleanly where it is not.

test_cases:
  - name: 'A table renders as a float whose caption precedes the tabularx'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC1: A three-column table with a caption line renders as a float whose
      caption precedes the tabularx and whose label follows the caption, with
      plain caption and label commands and no counter stepping.
    traces:
      - srd005-tables AC1
  - name: 'Column weights sum to the column count, each within its floor and clamp'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC2: The weighting applied to a table whose columns hold short, medium,
      and long cells produces weights summing to the column count, each at or
      above its floor and at or below the clamp.
    traces:
      - srd005-tables AC2
  - name: 'The two-column decision follows the column count, the widest cell, and the estimated height'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC3: A five-column table, a two-column table of 200-character cells, and
      a fifteen-row table of modest cells each select the starred environment;
      a small three-column table does not.
    traces:
      - srd005-tables AC3
  - name: 'A table with no caption line, and a caption line with no identifier, each fail'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC4: A pipe table with no caption line, and a caption line with no
      identifier, each fail with an error naming the file and line.
    traces:
      - srd005-tables AC4
  - name: 'No emitted table carries longtable, a strip environment, or a bold header row'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC5: No emitted table contains longtable, a strip environment, or a bold
      header row.
    traces:
      - srd005-tables AC5
  - name: 'A Table paragraph that follows no table renders as ordinary prose'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC6: A paragraph opening with the word Table and a colon that does not
      follow a table renders as an ordinary paragraph.
    traces:
      - srd005-tables AC6
  - name: 'Cells holding citations render the cite command'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC7: Cells holding citations render the cite command, demonstrating that
      cell content takes the inline path.
    traces:
      - srd005-tables AC7
  - name: 'A table with nothing to measure falls back to equal-width columns'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC8: A table whose cells offer nothing to measure falls back to equal-
      width columns rather than failing.
    traces:
      - srd005-tables AC8
  - name: 'Every emitted construct reads back with its caption, paragraph, and cell text as prose'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC1: Every fixture in the corpus reads back with its caption, paragraph,
      and cell text as prose, none of it inside a raw block.
    traces:
      - srd009-backport-compatibility AC1
  - name: 'A caption edited in an emitted float comes back as a prose difference confined to the caption'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC2: A caption edited in an emitted figure and in an emitted table both
      come back as a prose difference confined to the caption.
    traces:
      - srd009-backport-compatibility AC2
  - name: 'The forbidden forms appear nowhere in the emitted output'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC3: A grep over the library's output for adjustbox, refstepcounter, a
      strip environment, and longtable finds nothing.
    traces:
      - srd009-backport-compatibility AC3
  - name: 'An emitted table header carries no emphasis, and a backported table differs only in edited cells'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC4: An emitted table's header row carries no emphasis, and a backported
      table differs from its source in edited cells only.
    traces:
      - srd009-backport-compatibility AC4
  - name: 'A float-placement edit produces no prose difference'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC5: A float-placement edit made in an emitted float produces no prose
      difference, confirming the typesetting boundary rather than a failure.
    traces:
      - srd009-backport-compatibility AC5
  - name: 'The fixture tests skip where the reader is absent and run where it is present'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC6: The fixture tests skip cleanly where the reader is absent and run
      where it is present.
    traces:
      - srd009-backport-compatibility AC6
  - name: 'Options carries the graphics path and the float width thresholds the float renderers read'
    use_case: rel00.2-uc001-floats-in-two-columns
    status: planned
    description: |
      AC12: Options carries the citation key set, the graphics path, and the
      float width thresholds, and a caller constructs it without the library
      reading any configuration file. The citation key set is proven by the
      text core; the other two fields arrive with the float renderers, which
      is why docs/road-map.yaml records srd002-renderer-core R2.2 as deferred
      to this release.
    traces:
      - srd002-renderer-core AC12
  - name: 'srd004-figures R1.1, R1.2, R2.1, R2.2, R2.3, R4.1, and AC1 with the example the SRD states, byte for byte'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureRendersTheSRDExample
    status: done
    description: |
      TestFigureRendersTheSRDExample covers srd004-figures R1.1, R1.2, R2.1,
      R2.2, R2.3, R4.1, and AC1 with the example the SRD states, byte for byte.
    traces:
      - srd004-figures R1.1
      - srd004-figures R1.2
      - srd004-figures R2.1
      - srd004-figures R2.2
      - srd004-figures R2.3
      - srd004-figures R4.1
      - srd004-figures AC1
  - name: 'srd004-figures R3.1 and AC2 with the second example the SRD states'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestWideFigureSpansBothColumns
    status: done
    description: |
      TestWideFigureSpansBothColumns covers srd004-figures R3.1 and AC2 with the
      second example the SRD states.
    traces:
      - srd004-figures R3.1
      - srd004-figures AC2
  - name: 'srd004-figures R3.2, R3.4, and AC2 with the third example, plus the two-column measure'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureWidthScalesTheEnclosingMeasure
    status: done
    description: |
      TestFigureWidthScalesTheEnclosingMeasure covers srd004-figures R3.2, R3.4,
      and AC2 with the third example, plus the two-column measure.
    traces:
      - srd004-figures R3.2
      - srd004-figures R3.4
      - srd004-figures AC2
  - name: 'the directory is dropped because the container supplies a graphics path, and the extension is never rewritten'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureKeepsItsFileName
    status: done
    description: |
      TestFigureKeepsItsFileName covers srd004-figures R4.1, R4.2, and AC3: the
      directory is dropped because the container supplies a graphics path, and
      the extension is never rewritten.
    traces:
      - srd004-figures R4.1
      - srd004-figures R4.2
      - srd004-figures AC3
  - name: 'the caption escapes and renders inline constructs as a paragraph does'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureCaptionTakesTheInlinePath
    status: done
    description: |
      TestFigureCaptionTakesTheInlinePath covers srd004-figures R2.2: the
      caption escapes and renders inline constructs as a paragraph does.
    traces:
      - srd004-figures R2.2
  - name: 'identifiers are not normalized, slugged, or prefixed'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureIdentifierIsEmittedVerbatim
    status: done
    description: |
      TestFigureIdentifierIsEmittedVerbatim covers srd004-figures R2.3:
      identifiers are not normalized, slugged, or prefixed.
    traces:
      - srd004-figures R2.3
  - name: 'each failure names the construct and its line rather than emitting a float nobody can reference'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureErrors
    status: done
    description: |
      TestFigureErrors covers srd004-figures R1.3, R1.4, R3.3, R4.4, and AC4:
      each failure names the construct and its line rather than emitting a float
      nobody can reference.
    traces:
      - srd004-figures R1.3
      - srd004-figures R1.4
      - srd004-figures R3.3
      - srd004-figures R4.4
      - srd004-figures AC4
  - name: 'an image with other content beside it is inline, and inline images have no mapping'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestInlineImageIsNotAFloat
    status: done
    description: |
      TestInlineImageIsNotAFloat covers srd004-figures R1.1: an image with other
      content beside it is inline, and inline images have no mapping.
    traces:
      - srd004-figures R1.1
  - name: 'the renderer does not check that the figure exists, because conversion opens no file'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureReadsNoFile
    status: done
    description: |
      TestFigureReadsNoFile covers srd004-figures R4.3: the renderer does not
      check that the figure exists, because conversion opens no file.
    traces:
      - srd004-figures R4.3
  - name: 'no adjustbox, and nothing between the float and its caption'
    use_case: rel00.2-uc001-floats-in-two-columns
    go_test: TestFigureEmitsNoWrapper
    status: done
    description: |
      TestFigureEmitsNoWrapper covers srd004-figures R2.4 and AC5: no adjustbox,
      and nothing between the float and its caption.
    traces:
      - srd004-figures R2.4
      - srd004-figures AC5
