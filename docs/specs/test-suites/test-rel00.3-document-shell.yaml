id: test-rel00.3-document-shell
title: Test Suite for Release 00.3 Document Shell
release: "00.3"

overview: |
  This suite plans the evidence for the front-matter renderer and the
  container generator, the two components that turn fragments into a
  document latexmk can compile. Its cases carry no Go test yet: both
  components land with rel00.3, and each case names the acceptance criteria
  that release has to satisfy.

traces:
  - rel00.3-uc001-compilable-document

preconditions:
  - The text core of rel00.1 converts a prose chapter, which the abstract and the title-page body go through.
  - 'The front-matter renderer and the container generator are implemented: srd001-front-matter and srd008-container.'

test_cases:
  - name: 'A three-chapter roster produces the container in roster order'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC1: A three-chapter roster produces the container in the R1 example, in
      that order, with one input line per chapter and no extension on any
      input argument.
    traces:
      - srd008-container AC1
  - name: 'The front-matter chapter is input on the same terms as every other'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC2: The front-matter chapter appears in the input list on the same
      terms as every other chapter, with no special case in the generator.
    traces:
      - srd008-container AC2
  - name: 'An empty roster and a duplicate base name each fail naming the problem'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC3: An empty roster, and a roster with two chapters sharing a base
      name, each fail with an error naming the problem.
    traces:
      - srd008-container AC3
  - name: 'Generating twice yields byte-identical output and writes no file'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC4: Generating twice from the same roster yields byte-identical output,
      and the generator writes no file.
    traces:
      - srd008-container AC4
  - name: 'The container carries no section, float, or prose'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC5: The container contains no section, no float, and no prose - every
      line is a declaration, an input, or an environment delimiter.
    traces:
      - srd008-container AC5
  - name: 'A figure included by base name resolves under the emitted graphics path'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC6: A figure included by base name resolves under the emitted graphics
      path when the document is compiled from the tex directory.
    traces:
      - srd008-container AC6
  - name: 'An author edit to the preamble survives regeneration'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC7: An author edit to the preamble file survives regeneration, because
      the container names that file rather than carrying its contents.
    traces:
      - srd008-container AC7
  - name: 'A template renders a field escaped before substitution, and escapes nothing itself'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC7: A template renders a field that was escaped before substitution,
      and the template itself escapes nothing. The front-matter templates are
      the only templates in the library, which is why docs/road-map.yaml
      records srd003-escaping R3.3 as deferred to this release.
    traces:
      - srd003-escaping AC7
  - name: 'the fields the manuscripts state, with unknown fields ignored rather than rejected because Obsidian carries its own'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestReadDecodesTheMetadata
    status: done
    description: |
      TestReadDecodesTheMetadata covers srd001-front-matter R1.1 and R1.2: the
      fields the manuscripts state, with unknown fields ignored rather than
      rejected because Obsidian carries its own.
    traces:
      - srd001-front-matter R1.1
      - srd001-front-matter R1.2
  - name: 'a frontmatter field wins, a marked body run works, and the marker itself does not survive. Both fixtures are paperkit''s '
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestReadTakesTheAbstractFromEitherPlace covers srd001-front-matter R1.6,
      R1.7, R5.1, AC1, AC2, and AC6: a frontmatter field wins, a marked body run
      works, and the marker itself does not survive. Both fixtures are
      paperkit's own, from frontmatter_test.go, because R5.1 holds this decoding
      to the behavior the manuscripts are written against.
    traces:
      - srd001-front-matter R1.6
      - srd001-front-matter R1.7
      - srd001-front-matter R5.1
      - srd001-front-matter AC1
      - srd001-front-matter AC2
      - srd001-front-matter AC6
  - name: 'a scalar and a list both decode, the list joining with the word and'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestReadDecodesTheAuthorEitherWay covers srd001-front-matter R1.5 and AC7:
      a scalar and a list both decode, the list joining with the word and.
    traces:
      - srd001-front-matter R1.5
      - srd001-front-matter AC7
  - name: 'a page with no frontmatter, a duplicate key, and a missing title each fail naming the file'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestReadErrors covers srd001-front-matter R1.1, R1.3, R1.4, and AC5: a
      page with no frontmatter, a duplicate key, and a missing title each fail
      naming the file.
    traces:
      - srd001-front-matter R1.1
      - srd001-front-matter R1.3
      - srd001-front-matter R1.4
      - srd001-front-matter AC5
  - name: 'srd001-front-matter R2.1, R2.2, R2.4, and AC4 with the example the SRD states'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestTitleBlockRendersTheSRDExample covers srd001-front-matter R2.1, R2.2,
      R2.4, and AC4 with the example the SRD states.
    traces:
      - srd001-front-matter R2.1
      - srd001-front-matter R2.2
      - srd001-front-matter R2.4
      - srd001-front-matter AC4
  - name: 'srd001-front-matter R3.1, R3.2, and AC3 with the example the SRD states'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestAuthorFieldRendersTheSRDExample covers srd001-front-matter R3.1, R3.2,
      and AC3 with the example the SRD states.
    traces:
      - srd001-front-matter R3.1
      - srd001-front-matter R3.2
      - srd001-front-matter AC3
  - name: 'a plain name renders alone, and a list with a link inside is treated as R3.1 treats it'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestAuthorFieldWithoutALink
    status: done
    description: |
      TestAuthorFieldWithoutALink covers srd001-front-matter R3.3 and R3.4: a
      plain name renders alone, and a list with a link inside is treated as R3.1
      treats it.
    traces:
      - srd001-front-matter R3.3
      - srd001-front-matter R3.4
  - name: 'the author command is emitted only when there is an author'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestTitleBlockOmitsTheAuthorCommand
    status: done
    description: |
      TestTitleBlockOmitsTheAuthorCommand covers srd001-front-matter R2.1: the
      author command is emitted only when there is an author.
    traces:
      - srd001-front-matter R2.1
  - name: 'the fields are escaped before they reach the template, and the template escapes nothing of its own'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd003-escaping
    status: done
    description: |
      TestMetadataIsEscapedBeforeSubstitution covers srd001-front-matter R2.4,
      AC9, and srd003-escaping R3.3: the fields are escaped before they reach
      the template, and the template escapes nothing of its own.
    traces:
      - srd001-front-matter R2.4
      - srd003-escaping R3.3
      - srd001-front-matter AC9
  - name: 'srd001-front-matter R2.3 and AC8'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestDateIsDecodedAndNotEmitted covers srd001-front-matter R2.3 and AC8.
    traces:
      - srd001-front-matter R2.3
      - srd001-front-matter AC8
  - name: 'the reference also renders an acknowledgments file, and that stays with the caller. This component renders a title page '
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestTitlePageRendersNothingElse covers srd001-front-matter R5.3 and AC11:
      the reference also renders an acknowledgments file, and that stays with
      the caller. This component renders a title page and nothing else.
    traces:
      - srd001-front-matter R5.3
      - srd001-front-matter AC11
  - name: 'the abstract environment before the keywords block, and the keywords unescaped'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestRenderFrontMatterRendersTheSRDExample covers srd001-front-matter R4.1,
      R4.3, R4.4, R4.5, and AC1 with the example the SRD states: the abstract
      environment before the keywords block, and the keywords unescaped.
    traces:
      - srd001-front-matter R4.1
      - srd001-front-matter R4.3
      - srd001-front-matter R4.4
      - srd001-front-matter R4.5
      - srd001-front-matter AC1
  - name: 'the abstract converts rather than escaping, so the paper''s own emphasis and citations survive. This is the one knowing d'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestAbstractTakesTheChapterPath
    status: done
    description: |
      TestAbstractTakesTheChapterPath covers srd001-front-matter R4.1 and R5.2:
      the abstract converts rather than escaping, so the paper's own emphasis
      and citations survive. This is the one knowing difference from paperkit,
      which converts the abstract through pandoc.
    traces:
      - srd001-front-matter R4.1
      - srd001-front-matter R5.2
  - name: 'srd001-front-matter R4.2 and AC10'
    use_case: rel00.3-uc001-compilable-document
    go_test: srd001-front-matter
    status: done
    description: |
      TestNoAbstractEmitsNoEnvironment covers srd001-front-matter R4.2 and AC10.
    traces:
      - srd001-front-matter R4.2
      - srd001-front-matter AC10
  - name: 'the fixed order, one newline at the end, and no preamble'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestFrontMatterFragmentShape
    status: done
    description: |
      TestFrontMatterFragmentShape covers srd001-front-matter R4.4 and R4.5: the
      fixed order, one newline at the end, and no preamble.
    traces:
      - srd001-front-matter R4.4
      - srd001-front-matter R4.5
  - name: 'a body carrying an unmapped construct fails rather than emitting a fragment with a hole in it'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestFrontMatterReportsAFailedConversion
    status: done
    description: |
      TestFrontMatterReportsAFailedConversion covers srd001-front-matter R4.1
      and R4.3: a body carrying an unmapped construct fails rather than emitting
      a fragment with a hole in it.
    traces:
      - srd001-front-matter R4.1
      - srd001-front-matter R4.3
  - name: 'the abstract goes through the chapter path, so a key outside the caller''s corpus fails there too'
    use_case: rel00.3-uc001-compilable-document
    go_test: TestFrontMatterCitationsValidate
    status: done
    description: |
      TestFrontMatterCitationsValidate covers srd001-front-matter R4.1 with
      srd006-citations R3.1: the abstract goes through the chapter path, so a
      key outside the caller's corpus fails there too.
    traces:
      - srd001-front-matter R4.1
      - srd006-citations R3.1
