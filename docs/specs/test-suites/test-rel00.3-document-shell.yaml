id: test-rel00.3-document-shell
title: Test Suite for Release 00.3 Document Shell
release: "00.3"

overview: |
  This suite plans the evidence for the front-matter renderer and the
  container generator, the two components that turn fragments into a
  document latexmk can compile. Its cases carry no Go test yet: both
  components land with rel00.3, and each case names the acceptance criteria
  that release has to satisfy.

traces:
  - rel00.3-uc001-compilable-document

preconditions:
  - The text core of rel00.1 converts a prose chapter, which the abstract and the title-page body go through.
  - 'The front-matter renderer and the container generator are implemented: srd001-front-matter and srd008-container.'

test_cases:
  - name: 'A frontmatter abstract renders before a raw-LaTeX keywords body'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC1: A title page whose abstract is a frontmatter field and whose body
      is a raw-LaTeX keywords block renders the abstract environment before
      the keywords block, with the keywords block unescaped.
    traces:
      - srd001-front-matter AC1
  - name: 'An abstract marked in the body renders the same, without its marker'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC2: A title page whose abstract is marked in the body with a bold-
      italic run renders the same abstract environment, and the marker itself
      does not appear in the output.
    traces:
      - srd001-front-matter AC2
  - name: 'An author with a mailto link renders as a name and a monospace address'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC3: An author written with a mailto link renders as a name and a
      monospace address separated by a line break, with no bracket syntax
      surviving.
    traces:
      - srd001-front-matter AC3
  - name: 'A subtitle joins the title rather than taking a command of its own'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC4: A subtitle appears inside the title command after a line break and
      a large size command, and no subtitle command is emitted.
    traces:
      - srd001-front-matter AC4
  - name: 'A duplicate frontmatter key and a missing title each fail naming the file'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC5: A page with a duplicate frontmatter key, and a page with no title,
      each fail with an error naming the file.
    traces:
      - srd001-front-matter AC5
  - name: 'The paperkit fixtures produce the same title, author, and abstract'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC6: The title-page fixtures in paperkit's frontmatter_test.go produce
      the same title, author, and abstract content through this renderer.
    traces:
      - srd001-front-matter AC6
  - name: 'An author as a plain name and as a list both render as one escaped string'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC7: An author written as a plain name renders as the escaped name
      alone, and an author written as a list joins with the word and before
      rendering as one escaped string.
    traces:
      - srd001-front-matter AC7
  - name: 'A date is decoded and no date command is emitted'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC8: A page stating a date decodes it and emits no date command, because
      IEEEtran has no slot for one.
    traces:
      - srd001-front-matter AC8
  - name: 'A title carrying specials is escaped before substitution, not inside the template'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC9: A title carrying LaTeX special characters appears escaped inside
      the title command, demonstrating that the escaping happened before
      substitution rather than inside the template.
    traces:
      - srd001-front-matter AC9
  - name: 'A page with no abstract emits no abstract environment'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC10: A page with no abstract emits no abstract environment at all,
      rather than an empty one.
    traces:
      - srd001-front-matter AC10
  - name: 'Rendering a title page emits no acknowledgment section'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC11: Rendering a title page emits no acknowledgment section, and the
      component exposes no entry point for one.
    traces:
      - srd001-front-matter AC11
  - name: 'A three-chapter roster produces the container in roster order'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC1: A three-chapter roster produces the container in the R1 example, in
      that order, with one input line per chapter and no extension on any
      input argument.
    traces:
      - srd008-container AC1
  - name: 'The front-matter chapter is input on the same terms as every other'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC2: The front-matter chapter appears in the input list on the same
      terms as every other chapter, with no special case in the generator.
    traces:
      - srd008-container AC2
  - name: 'An empty roster and a duplicate base name each fail naming the problem'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC3: An empty roster, and a roster with two chapters sharing a base
      name, each fail with an error naming the problem.
    traces:
      - srd008-container AC3
  - name: 'Generating twice yields byte-identical output and writes no file'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC4: Generating twice from the same roster yields byte-identical output,
      and the generator writes no file.
    traces:
      - srd008-container AC4
  - name: 'The container carries no section, float, or prose'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC5: The container contains no section, no float, and no prose - every
      line is a declaration, an input, or an environment delimiter.
    traces:
      - srd008-container AC5
  - name: 'A figure included by base name resolves under the emitted graphics path'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC6: A figure included by base name resolves under the emitted graphics
      path when the document is compiled from the tex directory.
    traces:
      - srd008-container AC6
  - name: 'An author edit to the preamble survives regeneration'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC7: An author edit to the preamble file survives regeneration, because
      the container names that file rather than carrying its contents.
    traces:
      - srd008-container AC7
  - name: 'A template renders a field escaped before substitution, and escapes nothing itself'
    use_case: rel00.3-uc001-compilable-document
    status: planned
    description: |
      AC7: A template renders a field that was escaped before substitution,
      and the template itself escapes nothing. The front-matter templates are
      the only templates in the library, which is why docs/road-map.yaml
      records srd003-escaping R3.3 as deferred to this release.
    traces:
      - srd003-escaping AC7
